<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background with slight rounding -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#262626" stroke-width="4"/>

  <!-- Open Book Symbol -->
  <g transform="translate(96, 110)">
    <!-- Book Left Page -->
    <path d="M160 80 C110 50, 40 54, 0 66 L0 260 C40 248, 110 244, 160 274 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Book Right Page -->
    <path d="M160 80 C210 50, 280 54, 320 66 L320 260 C280 248, 210 244, 160 274 Z" fill="#f5f5f5"/>
    <!-- Book Spine Glow -->
    <line x1="160" y1="80" x2="160" y2="274" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Left page text lines -->
    <line x1="36" y1="120" x2="124" y2="106" stroke="#d4d4d4" stroke-width="6" stroke-linecap="round"/>
    <line x1="36" y1="150" x2="124" y2="136" stroke="#d4d4d4" stroke-width="6" stroke-linecap="round"/>
    <line x1="36" y1="180" x2="100" y2="168" stroke="#d4d4d4" stroke-width="6" stroke-linecap="round"/>

    <!-- Right page text lines -->
    <line x1="196" y1="106" x2="284" y2="120" stroke="#d4d4d4" stroke-width="6" stroke-linecap="round"/>
    <line x1="196" y1="136" x2="284" y2="150" stroke="#d4d4d4" stroke-width="6" stroke-linecap="round"/>
    <line x1="196" y1="168" x2="260" y2="180" stroke="#d4d4d4" stroke-width="6" stroke-linecap="round"/>

    <!-- POS Scanner / Barcode Accent Badge -->
    <g transform="translate(60, 220)">
      <rect width="200" height="64" rx="14" fill="#0f172a" stroke="#334155" stroke-width="3"/>
      <!-- Barcode lines -->
      <line x1="24" y1="18" x2="24" y2="46" stroke="#38bdf8" stroke-width="4"/>
      <line x1="34" y1="18" x2="34" y2="46" stroke="#38bdf8" stroke-width="2"/>
      <line x1="44" y1="18" x2="44" y2="46" stroke="#38bdf8" stroke-width="6"/>
      <line x1="56" y1="18" x2="56" y2="46" stroke="#38bdf8" stroke-width="3"/>
      <line x1="68" y1="18" x2="68" y2="46" stroke="#38bdf8" stroke-width="5"/>
      <line x1="80" y1="18" x2="80" y2="46" stroke="#38bdf8" stroke-width="2"/>
      <line x1="92" y1="18" x2="92" y2="46" stroke="#38bdf8" stroke-width="4"/>
      <!-- Scanner laser beam -->
      <line x1="16" y1="32" x2="184" y2="32" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-dasharray="160" stroke-dashoffset="0"/>
      <!-- Green Verified Dot -->
      <circle cx="166" cy="32" r="6" fill="#10b981"/>
    </g>
  </g>
</svg>
